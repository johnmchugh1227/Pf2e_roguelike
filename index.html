*{box-sizing:border-box}body{margin:0;background:#172925;color:#f9efdc;font:16px/1.5 'DM Sans',system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:clamp(16px,3vw,38px)}h1,h2,h3,p{margin:0 0 .6rem}h1,h2,h3{font-family:Georgia,serif}h1{font-size:clamp(28px,4vw,44px)}h2{font-size:25px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #789284;margin-bottom:16px}small{color:#d7c69d}ul{padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 24px}li{border:1px solid #80948a;padding:5px 11px;border-radius:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{display:flex;flex-direction:column;background:#f5edd9;color:#252d26;border-top:5px solid #c29251;padding:16px;border-radius:5px;min-width:0}.card p{font-size:15px}.card footer{margin-top:auto;padding-top:12px}button,summary{cursor:pointer;min-height:44px;font:inherit}summary{color:#335c49;padding:9px 0}button{border:1px solid #789284;background:#284c3d;color:white;border-radius:5px;padding:8px 14px}button:focus-visible,summary:focus-visible{outline:3px solid #d28825;outline-offset:2px}.card button{width:100%}button:disabled{opacity:.55;cursor:not-allowed}button[aria-pressed=true]{outline:3px solid #d5b36b;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}@media(max-width:640px){.grid{grid-template-columns:1fr}header{align-items:baseline;gap:10px}main{padding:15px}}
.mapscroll{overflow-x:auto}.map{display:grid;grid-template-columns:repeat(9,minmax(32px,1fr));gap:2px;max-width:580px}.sq{min-height:34px;aspect-ratio:1.25;padding:0;border-radius:3px;color:#fcf8e6;font-weight:bold}.sq:disabled{opacity:1}.tfloor{background:#293d36}.available{background:#527462;border-color:#afc7a0}.twall{background:#111e1a}.tc{background:#7b6447}.tA{background:#934a3d}.edge{border-right:3px solid #dcbc71}.pawn{background:#224f65}.current,.selected{outline:3px solid #e4bc74;outline-offset:-4px}.legend{font-size:13px;color:#e3d6bb;margin:8px 0}.turn{color:#efcf95}
.dropped-weapon{box-shadow:inset 0 0 0 2px #d6aa67}.charge-dest{outline:2px solid #75a7e0!important;outline-offset:-3px}.charge-chosen{outline:3px solid #d8edff!important;outline-offset:-4px}.hampered{border-bottom:3px solid #a8b8dc!important}.area-aim{outline:2px solid #e8cc76!important;outline-offset:-3px}.area-hit{background:#8c542a!important;color:#fff}.area-center{outline:3px solid #fff1b1!important;outline-offset:-4px}.tumble-dest{outline:2px solid #5bc9ce!important;outline-offset:-3px}.tumble-chosen{background:#236c78!important;color:#fff}.force-dest{outline:2px solid #c591f2!important;outline-offset:-3px}.force-chosen{background:#7250a0!important;color:#fff}.hazard-unknown{box-shadow:inset 0 0 0 2px #d2b878;color:#f4da9e}.hazard-bones{box-shadow:inset 0 0 0 2px #b5a589}.hazard-plate{box-shadow:inset 0 0 0 2px #e6b354;color:#ffd997}.hazard-rune,.hazard-altar{box-shadow:inset 0 0 0 2px #be8eea;color:#e2b9ff}.hazard-panel{border:1px solid #625571;border-radius:8px;padding:8px;margin:8px 0}.large-enemy{background:#6c3840!important;box-shadow:inset 0 0 0 1px #e5a095}.flank-dest{box-shadow:inset 0 0 0 2px #9ce5ae}.flank-target{border:2px solid #9ce5ae}.flank-risk{border:2px dashed #f1a36b}
.danger{box-shadow:inset 0 0 0 2px #e16d5b;background:#63413a}.danger.available{background:#805749}
.party-status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0 12px;max-width:580px}
.party-member{min-width:0;background:#213a32;border:1px solid #547266;border-radius:6px;padding:8px}
.party-member.active{border-color:#efcf95;box-shadow:inset 0 0 0 1px #efcf95}
.party-member.down{background:#352c2b}
.party-name{display:flex;gap:5px;align-items:flex-start;font-size:13px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
.party-number{flex:none;width:19px;height:19px;line-height:19px;border-radius:4px;background:#326b8c;color:white;text-align:center}
.party-hp{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.party-hp strong{font-size:17px;line-height:1.15;white-space:nowrap}
.party-hp small{font-size:11px}
.hp-track{height:7px;border-radius:4px;background:#111e1a;overflow:hidden}
.hp-fill{height:100%;background:#70b98b}.hp-fill.wounded{background:#e4bb65}.hp-fill.critical{background:#e47e70}
.party-detail{font-size:11px;line-height:1.2;margin-top:4px;min-height:1.2em;color:#ded8c7}
.party-meta{max-width:580px;font-size:12px;color:#ded8c7;margin:0 0 8px}
.heal-actions{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.heal-actions button{min-height:44px;text-align:left;line-height:1.3}
.heal-actions button small{display:block;font-size:12px;color:#f0ddbc}

function equipmentArt(m){if(!m)return '';if(m.kind==='charm')return iconArt('trinkets');if(m.kind==='supply')return iconArt('consumables');const n=m.name.toLowerCase();return iconArt(/pole|guisarme|halberd|glaive/.test(n)?'polearm':/bow/.test(n)?'bow':/staff/.test(n)?'staff':/dagger|needle|knife/.test(n)?'dagger':/spear|javelin/.test(n)?'spear':/axe|hatchet/.test(n)?'axe':/hammer|mace|club|maul/.test(n)?'hammer':'sword')}
function wardstoneArt(z){return z.destroyed?'wardstone-destroyed':z.active?'wardstone-active':'wardstone-dormant'}
function mapTheme(){return ['crypt-map','warrens-map','watchfort-map'][run.floor]||''}
function coverArt(){const low=layout().low.toLowerCase();return run.floor===1?(/barricade|sandbag/.test(low)?'driftwood-barricade':'damaged-pillar'):run.floor===2?(/weapon rack/.test(low)?'weapon-rack':/barricade/.test(low)?'timber-barricade':'broken-masonry'):'pillar'}

}

const roster = [
  ["fighter", "shield"], ["fighter", "reach"],
  ["rogue", "thief"], ["rogue", "mastermind"],
  ["cleric", "healing"], ["cleric", "harmful"],
  ["champion", "justice"], ["champion", "liberation"],
  ["guardian", "bodyguard"]
];

function dealDraft(seed, cards = roster) {
  if (!Number.isInteger(seed) || seed < 0 || seed > 0xffffffff)
    throw new RangeError("Expected an unsigned 32-bit seed");
  if (cards.length < 9 || new Set(cards.map(card => card[1])).size !== cards.length)
    throw new RangeError("Draft needs at least nine distinct hero IDs");
  let state = seed;
  function index(size) {
    const limit = 0x100000000 - 0x100000000 % size;
    let sample;
    do {
      state = (state + 0x9e3779b9) >>> 0;
      sample = Math.imul(state ^ (state >>> 16), 0x21f0aaad);
      sample = Math.imul(sample ^ (sample >>> 15), 0x735a2d97);
      sample = (sample ^ (sample >>> 15)) >>> 0;
    } while (sample >= limit);
    return sample % size;
  }
  const remaining = new Map();
  for (const [group, id] of cards) {
    if (!remaining.has(group)) remaining.set(group, []);
    remaining.get(group).push(id);
  }
  const offers = [];
  for (let i = 0; i < 9; i++) {
    const groups = [...remaining.keys()];
    const group = groups[index(groups.length)];
    const variants = remaining.get(group);
    const [hero] = variants.splice(index(variants.length), 1);
    if (!variants.length) remaining.delete(group);
    offers.push(hero);
  }
  return [offers.slice(0, 3), offers.slice(3, 6), offers.slice(6)];
}

 kit(s);if(d.quickdraw){quickDraw(s,s.active,d.quickdraw==='starter'?null:d.quickdraw);return true}if(d.chargecancel){s.chargePlan=null;return true}if(d.chargecell!==undefined){selectCharge(s,Number(d.chargecell));return true}if(d.chargeconfirm){resolveCharge(s);return true}if(d.recallmonster){recallMonster(s);return true}if(d.strikehazard!==undefined){strikeHazard(s,Number(d.strikehazard));return true}if(d.areacancel){s.areaPlan=null;return true}if(d.areacell!==undefined){selectArea(s,Number(d.areacell));return true}if(d.areaconfirm){confirmArea(s);return true}if(d.tumblecancel){s.tumblePlan=null;preview=null;return true}if(d.tumblecell!==undefined){selectTumble(s,Number(d.tumblecell));return true}if(d.tumbleconfirm){resolveTumble(s);return true}if(d.forcecancel){s.forcePlan=null;preview=null;return true}if(d.forcecell!==undefined){selectForce(s,Number(d.forcecell));return true}if(d.forceconfirm){resolveForce(s);return true}if(d.equip){equipLoot(s,Number(d.recipient),d.equip,d.equipkey==='starter'?null:d.equipkey,true);return true}if(d.supply){useSupply(s,Number(d.recipient),d.supply,true);return true}if(d.hazardtarget!==undefined){const j=Number(d.hazardtarget);if(s.hazards[j]?.active){s.hazardTarget=j;s.forcePlan=null;s.tumblePlan=null;s.areaPlan=null;s.chargePlan=null;preview=null}return true}if(d.hazardcell!==undefined){const pos=Number(d.hazardcell),j=s.hazards.findIndex(z=>z.active&&z.pos===pos);if(j>=0){s.hazardTarget=j;s.forcePlan=null;s.tumblePlan=null;s.areaPlan=null;s.chargePlan=null;preview=moves().has(pos)?pos:null}return true}if(d.recallhazard!==undefined){recallHazard(s,Number(d.recallhazard));return true}if(d.disablehazard!==undefined){disableHazard(s,Number(d.disablehazard));return true}if(d.grabescape){escapeGrab(s);return true}if(d.webescape){if(s.webEscapeBlocked!==s.active)escapeWeb(s);return true}if(d.stand){standHero(s);return true}if(d.release){const e=holdEnemy(s,s.active);if(e)releaseGrab(e,s,'released');return true}if(d.aggressivetoggle!= function bestiaryPanel(){return '<details><summary>General bestiary · '+generalBestiary.filter(x=>x.playable).length+' of '+generalBestiary.length+' playable</summary><ul>'+generalBestiary.map(x=>'<li><b>'+x.name+'</b> · '+x.role+' · '+x.ability+(x.playable?'':' (planned)')+'</li>').join('')+'</ul><p class="legend">Environment pools are planned separately; current floor choices use the original three environments. Seeded general slots preserve room difficulty and boss milestones.</p></details>'+(run.floor===0?'<details><summary>Crypt bestiary · 9 themed types</summary><ul>'+environmentBestiary.crypt.map(id=>'<li><b>'+monsterTypes[id].label+'</b> · '+monsterTypes[id].info+'</li>').join('')+'</ul><p class="legend">Budgeted themed encounters vary in size and creature levels. General creatures appear in rooms 4, 6 and 9; potential reinforcements are reserved in the budget.</p></details>':'')}

function readBoardSquare(square){
 const board=square.closest('.combat-board');
 const old=board.querySelector('.sq[aria-current="true"]');
 if(old){old.removeAttribute('aria-current');old.tabIndex=-1}
 square.setAttribute('aria-current','true');
 square.tabIndex=0;
 board.querySelector('#tile-readout').textContent=square.getAttribute('aria-label');
}
function toggleTileReading(toggle){
 const board=toggle.closest('.combat-board'),reading=toggle.getAttribute('aria-pressed')==='false';
 toggle.setAttribute('aria-pressed',String(reading));
 toggle.textContent=reading?'Finish reading tiles':'Read tiles';
 const readout=board.querySelector('#tile-readout');
 readout.hidden=!reading;
 for(const square of board.querySelectorAll('.sq')){
  if(reading){
   if(square.disabled)square.dataset.readOnlyTile='1';
   square.disabled=false;
   square.tabIndex=-1;
  }else{
   square.disabled=square.hasAttribute('data-read-only-tile');
   square.removeAttribute('data-read-only-tile');
   square.removeAttribute('tabindex');
   square.removeAttribute('aria-current');
  }
 }
 if(reading){
  const current=board.querySelector('.sq.current');
  readBoardSquare(current);
  readout.textContent+=' · Tap a tile or use the arrow keys to inspect.';
  if(toggle.matches(':focus-visible'))current.focus();
 }
}
app.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  const toggle=app.querySelector('[data-readtiles][aria-pressed="true"]');
  if(toggle){e.preventDefault();toggleTileReading(toggle);toggle.focus()}
  return;
 }
 const square=e.target.closest?.('.sq[aria-current="true"]');
 if(!square)return;
 const i=Number(square.dataset.square),x=i%9;
 const steps={ArrowLeft:x>0?-1:0,ArrowRight:x<8?1:0,ArrowUp:i>=9?-9:0,ArrowDown:i<36?9:0};
 if(!Object.hasOwn(steps,e.key))return;
 e.preventDefault();
 const next=square.closest('.map').querySelector('[data-square="'+(i+steps[e.key])+'"]');
 readBoardSquare(next);
 next.focus();
});
