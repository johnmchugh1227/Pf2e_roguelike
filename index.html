function dealDraft(seed, cards = roster) {
  if (!Number.isInteger(seed) || seed < 0 || seed > 0xffffffff)
    throw new RangeError("Expected an unsigned 32-bit seed");
  if (cards.length < 9 || new Set(cards.map(card => card[1])).size !== cards.length)
    throw new RangeError("Draft needs at least nine distinct hero IDs");
  let state = seed;
  function index(size) {
    const limit = 0x100000000 - 0x100000000 % size;
    let sample;
    do {
      state = (state + 0x9e3779b9) >>> 0;
      sample = Math.imul(state ^ (state >>> 16), 0x21f0aaad);
      sample = Math.imul(sample ^ (sample >>> 15), 0x735a2d97);
      sample = (sample ^ (sample >>> 15)) >>> 0;
    } while (sample >= limit);
    return sample % size;
  }
  const remaining = new Map();
  for (const [group, id] of cards) {
    if (!remaining.has(group)) remaining.set(group, []);
    remaining.get(group).push(id);
  }
  const offers = [];
  for (let i = 0; i < 9; i++) {
    const groups = [...remaining.keys()];
    const group = groups[index(groups.length)];
    const variants = remaining.get(group);
    const [hero] = variants.splice(index(variants.length), 1);
    if (!variants.length) remaining.delete(group);
    offers.push(hero);
  }
  return [offers.slice(0, 3), offers.slice(3, 6), offers.slice(6)];
}

function creatureXP(lv,party=level()){return creatureXPTable[lv-party]??Infinity}

function budgetCreature(id,party,variant=0){
 const type=id==='skeletonArcher'?'skeleton':id,standard=Math.max(-1,party+(monsterRelative[id]??-1)),lv=standard+variant;
 if(lv<-1||!Number.isFinite(creatureXP(lv,party)))return null;
 let m;if(type==='cryptWarden'){m=cryptMonster({...baseEnemySpecs()[0],max:125,attack:17},type)}else{
 const base=creatureBase(standard,0,id!=='skeletonArcher');m=generalBestiary.some(x=>x.id===type)?generalMonster(base,type):cryptMonster(base,type);
 // Keep standard monster identity, then apply simplified Weak/Elite adjustments.
 m.flat=(m.flat??(m.guard?2:0))+Math.floor(Math.max(0,standard)/3);
 if(variant){const hpDelta=standard<=1?5:standard<=4?10:15;
 for(const stat of ['ac','attack','init','fort','reflex','will','perception'])m[stat]=(m[stat]??0)+2*variant;

 }

function encounterSpawn(es,room){const occupied=new Set([9,18,27]),map=layout().rows.join(''),preferred=['A','B','C'].map(k=>map.indexOf(k)),fallback=[15,24,33];
