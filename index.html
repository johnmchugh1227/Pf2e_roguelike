function dealDraft(seed, cards = roster) {
  if (!Number.isInteger(seed) || seed < 0 || seed > 0xffffffff)
    throw new RangeError("Expected an unsigned 32-bit seed");
  if (cards.length < 9 || new Set(cards.map(card => card[1])).size !== cards.length)
    throw new RangeError("Draft needs at least nine distinct hero IDs");
  let state = seed;
  function index(size) {
    const limit = 0x100000000 - 0x100000000 % size;
    let sample;
    do {
      state = (state + 0x9e3779b9) >>> 0;
      sample = Math.imul(state ^ (state >>> 16), 0x21f0aaad);
      sample = Math.imul(sample ^ (sample >>> 15), 0x735a2d97);
      sample = (sample ^ (sample >>> 15)) >>> 0;
    } while (sample >= limit);
    return sample % size;
  }
  const remaining = new Map();
  for (const [group, id] of cards) {
    if (!remaining.has(group)) remaining.set(group, []);
    remaining.get(group).push(id);
  }
  const offers = [];
  for (let i = 0; i < 9; i++) {
    const groups = [...remaining.keys()];
    const group = groups[index(groups.length)];
    const variants = remaining.get(group);
    const [hero] = variants.splice(index(variants.length), 1);
    if (!variants.length) remaining.delete(group);
    offers.push(hero);
  }
  return [offers.slice(0, 3), offers.slice(3, 6), offers.slice(6)];
}

 h+='<div class="actions"><button data-strike="1" '+(can?'':'disabled')+'>Strike '+foeName().toLowerCase()+' ('+(mod>=0?'+':'')+mod+')</button>'+(shield?'<button data-raise="1" '+(s.raised[s.active]?'disabled':'')+'>Raise Shield · +2 AC</button>':'')+'</div><p>'+(!can?'Move into weapon reach and line of effect.':'Target AC '+targetAC(s,s.active))+'</p>'+skillButtons(s)+(['healing','harmful'].includes(id)?'<p>Rank '+fontRank()+' font casts left: '+s.font[s.active]+'</p>':'')+('<p class="legend">'+({shield:'Reactive Strike triggers automatically when the archer fires in reach.',reach:'Reactive Strike triggers automatically when the archer fires in reach.',justice:'Automatic reaction: protect an ally in your aura and retaliate if the archer is in reach.',liberation:'Automatic reaction: protect an ally in your aura and Step them away if space permits.',thief:'Flank opposite a melee ally to make the archer off-guard and enable Sneak Attack.',mastermind:'Identify the archer to enable a ranged Sneak Attack.',bodyguard:'Taunt draws enemy attention. Attacks excluding you take −1 and make the enemy off-guard.',harmful:run.floor===0?'This skeletal archer is undead. Harm cannot damage it.':'Harm targets the living archer within 30 ft.',healing:'Heal a wounded ally within 30 ft, or use Heal offensively against undead.'}[id]).replaceAll('archer',foeName().toLowerCase()).replace('gate guard fires','gate guard throws a javelin')+'</p>')+(s.potions>0&&s.hp[s.active]<profile(id)[0]?'<button data-drink="1">Drink minor healing potion · 1 action ('+s.potions+' left · '+hpInfo(s,s.active).missing+' HP missing)</button>':'')+featButtons(s,selected)+combatLog(s,8);return h}
function swipeOther(s){const e=target(s),from=s.pos[s.active],reach=run.picks[s.active]==='reach'?2:1;if(!reachOK(s))return -1;
 return s.enemies.findIndex(x=>x!==e&&x.hp>0&&dist(x.pos,e.pos)===1&&dist(x.pos,from)<=reach&&clear(from,x.pos))}
function proudReady(s){const e=target(s);return e.ignoredTaunt===s.active&&e.exposed&&reachOK(s)&&!s.flourish}
function featButtons(s,selected){const i=s.active,fs=allFeats(i);if(!fs.length)return '';
 let h='<p>Selected feats: '+fs.map(f=>f+(liveFeats.has(f)?'':' (pending)')).join(' · ')+'</p>';
 if(hasFeat(i,'Lunge'))h+='<button data-special="lunge" '+(reachOK(s,1)?'':'disabled')+'>Lunge · 1 action</button>';
 if(hasFeat(i,'Intimidating Strike'))h+='<button data-special="fear" '+(s.actions>=2&&reachOK(s)?'':'disabled')+'>Intimidating Strike · 2 actions</button>';
 if(hasFeat(i,'Defensive Advance'))h+='<button data-special="advance" '+(s.actions>=2&&selected&&!s.flourish?'':'disabled')+'>Defensive Advance to selected square · 2 actions</button>';
 if(hasFeat(i,'Swipe'))h+='<button data-special="swipe" '+(s.actions>=2&&!s.flourish&&swipeOther(s)>=0?'':'disabled')+'>Swipe · 2 actions</button>';
 if(hasFeat(i,'Shielding Taunt'))h+='<button data-special="shieldtaunt" '+(!s.flourish&&dist(s.pos[i],enemySquare())<=6&&clear(s.pos[i],enemySquare())?'':'disabled')+'>Shielding Taunt · 1 action</button>';
 if(hasFeat(i,'Proud Nail'))h+='<button data-special="proud" '+(proudReady(s)?'':'disabled')+'>Proud Nail · 1 action</button>';
 return h}
function useFeat(s,k){const i=s.active;
 if(k==='lunge'&&hasFeat(i,'Lunge')&&reachOK(s,1)){note(s,'Lunge');swing(s,i);payAction();return true}
 if(k==='fear'&&hasFeat(i,'Intimidating Strike')&&s.actions>=2&&reachOK(s)){const e=target(s),before=e.hp;swing(s,i);if(e.hp<before&&e.hp>0){e.frightened=Math.max(e.frightened||0,s.lastDegree===3?2:1);note(s,e.name+' · Intimidating Strike · frightened '+e.frightened)}s.actions--;payAction();return true}
 if(k==='advance'&&hasFeat(i,'Defensive Advance')&&s.actions>=2&&!s.flourish){const m=moves().get(preview);if(!m)return false;s.flourish=true;s.raised[i]=true;heroStride(s,m);note(s,'Defensive Advance · shield raised, Stride');if(s.hp[i]>0&&!won(s)&&reachOK(s))swing(s,i);s.actions--;payAction();return true}
 if(k==='shieldtaunt'&&hasFeat(i,'Shielding Taunt')&&!s.flourish&&dist(s.pos[i],enemySquare())<=6&&clear(s.pos[i],enemySquare())){s.flourish=true;s.raised[i]=true;applyTaunt(s,i);note(s,'Shielding Taunt · shield raised');payAction();return true}
 if(k==='proud'&&hasFeat(i,'Proud Nail')&&proudReady(s)){s.flourish=true;swing(s,i,false,true);payAction();return true}
 if(k==='swipe'&&hasFeat(i,'Swipe')&&s.actions>=2&&!s.flourish){const other=swipeOther(s);if(other<0)return false;const original=s.target,id=run.picks[i],pf=profile(id),bonus=pf[2]-penalty(s.attacks),d=roll(s,20);let base=3+attrDelta(i,atkAttr(id));for(let j=0;j<weaponDice(i);j++)base+=roll(s,pf[3]);s.flourish=true;
 for(const j of [original,other]){s.target=j;const ac=targetAC(s,i),deg=outcome(d,bonus,ac),damage=deg>=2?base*(deg===3?2:1):0;note(s,'Swipe → '+foeName()+' · d20 '+d+' + ('+bonus+') vs AC '+ac+' · '+['critical miss','miss','hit','critical hit'][deg]+' · '+damage+' damage');damageEnemy(s,damage)}
 s.target=original;s.attacks+=2;s.actions--;payAction();return true}
 return false}
function battleClick(d){if(!run.battle||d.reset)return false;const s=run.battle;
 if(!s.hp.some(h=>h>0)){if(d.retry){run.battle=newRoom();enemyTurn()}return true}if(won(s)){kit(s);s.potions??=s.reward&&!secondRoom()?1:0;
 if(d.claim&&!s.reward){s.reward=true;s.potions+=secondRoom()?2:1}
 else if(d.levelup)startAdvancement(s);
 else if(run.advancement&&!run.advancement.done&&d.advhero!==undefined){const i=Number(d.advhero);if(Number.isInteger(i)&&i>=0&&i<3){run.advancement.hero=i;run.advancement.all=false}}
 else if(run.advancement&&!run.advancement.done&&d.allfeats)run.advancement.all=!run.advancement.all;
 else if(run.advancement&&!run.advancement.done&&d.feat!==undefined)chooseFeat(run.advancement,run.advancement.hero,Number(d.feat));
 else if(run.advancement&&d.finishadv)finishAdvancement(run.advancement);
 else if(secondRoom()&&run.advancement?.done&&d.rechoose){run.advancement.done=false;run.advancement.hero=0;run.advancement.all=false}
 else if(secondRoom()&&run.advancement?.done&&d.rune!==undefined){const i=Number(d.rune);if(Number.isInteger(i)&&i>=0&&i<3)run.runeHero=i}
 else if(secondRoom()&&run.advancement?.done&&d.third&&Number.isInteger(run.runeHero)){run.entry={hp:s.hp.slice(),font:s.font.slice(),potions:s.potions};run.room=3;preview=null;run.battle=newRoom();enemyTurn()}
 else if(thirdRoom()&&s.reward&&d.fourth)enterFollowing(s,4);
 else if(fourthRoom()&&d.genstart)startGeneral(s);
 else if(fourthRoom()&&run.general&&!run.general.done&&d.genhero!==undefined){const i=Number(d.genhero);if(Number.isInteger(i)&&i>=0&&i<3)run.general.hero=i}
 else if(fourthRoom()&&run.general&&!run.general.done&&d.genfeat!==undefined)chooseGeneral(s,run.general.hero,Number(d.genfeat));
 else if(fourthRoom()&&d.genfinish)finishGeneral(s);
 else if(fourthRoom()&&run.general?.done&&d.fifth&&s.reward)enterFollowing(s,5);
 else if(fifthRoom()&&s.reward&&d.sixth)enterFollowing(s,6);
 else if(sixthRoom()&&d.fourstart)start4(s);
 else if(sixthRoom()&&run.adv4&&!run.adv4.done&&d.fourhero!==undefined){const i=Number(d.fourhero);if(Number.isInteger(i)&&i>=0&&i<3){run.adv4.hero=i;run.adv4.all=false}}
 else if(sixthRoom()&&run.adv4&&!run.adv4.done&&d.fourall)run.adv4.all=!run.adv4.all;
 else if(sixthRoom()&&run.adv4&&!run.adv4.done&&d.fourfeat)choose4(run.adv4.hero,d.fourfeat);
 else if(sixthRoom()&&d.fourfinish)finish4();
 else if(sixthRoom()&&run.adv4?.done&&s.reward&&d.seventh)enterFollowing(s,7);
 else if(seventhRoom()&&s.reward&&d.eighth)enterFollowing(s,8);
 else if(eighthRoom()&&d.fivestart)start5(s);
 else if(eighthRoom()&&run.adv5&&!run.adv5.done&&d.fivehero!==undefined){const i=Number(d.fivehero);if(Number.isInteger(i)&&i>=0&&i<3)run.adv5.hero=i}
 else if(eighthRoom()&&run.adv5&&!run.adv5.done&&d.boost!==undefined)boost5(run.adv5.hero,Number(d.boost));
 else if(eighthRoom()&&d.fivefinish)finish5(s);
 else if(eighthRoom()&&run.adv5?.done&&Number.isInteger(run.runeHero)&&d.striking)run.striking=true;
 else if(eighthRoom()&&run.adv5?.done&&run.striking&&s.reward&&d.ninth)enterFollowing(s,9);
 else if(ninthRoom()&&s.reward&&d.tenth)enterFollowing(s,10);
 else if(d.potion!==undefined)drink(s,Number(d.potion));
 else if(d.next&&s.reward&&(run.room||1)===1){run.entry={hp:s.hp.slice(),font:s.font.slice(),potions:s.potions};run.room=2;preview=null;run.battle=newRoom();enemyTurn()}return true}
 kit(s);if(d.target!==undefined){const i=Number(d.target);if(Number.isInteger(i)&&s.enemies[i]?.hp>0){s.target=i;preview=null}return true}if(d.special){useFeat(s,d.special);return true}if(d.drink){if(drink(s,s.active))payAction();return true}if(d.skill){useSkill(s,d.skill);return true}if(d.strike&&reachOK(s)){swing(s,s.active);payAction();return true}
 if(d.raise&&!s.raised[s.active]&&['shield','harmful','justice','liberation','bodyguard'].includes(run.picks[s.active])){s.raised[s.active]=true;payAction();return true}
 if(d.cell!==undefined){let i=Number(d.cell);if(moves().has(i))preview=i}
 else if(d.step&&stepOK(s,preview)){s.pos[s.active]=preview;note(s,name(run.picks[s.active])+' Steps safely.');payAction()}
 else if(d.stride){const m=moves().get(preview);if(m){heroStride(s,m);payAction()}}
 else if(d.end){preview=null;advance();enemyTurn()}return true}

function render(){if(run.battle){app.innerHTML=field();return}const n=run.picks.length;let heading,body;if(n<3){heading='Choose hero '+(n+1)+' of 3';body=dealDraft(run.seed)[n].map(heroCard).join('')}else if(run.floor===null){heading='Choose the first floor';body=floors.map(([title,desc],i)=>'<article class="card"><h3>'+title+'</h3><p>'+desc+'</p><footer><button data-floor="'+i+'">Choose '+title+'</button></footer></article>').join('')}else{heading=floors[run.floor][0];body='<article class="card"><h3>Expedition assembled</h3><p>Your party and starting environment are selected.</p><button data-enter="1">Enter room 1</button></article>'}
app.innerHTML='<header><h1>Expedition draft</h1><small>Seed '+run.seed+'</small></header><b>Party</b><ul>'+Array.from({length:3},(_,i)=>'<li>'+(run.picks[i]?name(run.picks[i]):'Open slot')+'</li>').join('')+'</ul><h2 id="stage" tabindex="-1">'+heading+'</h2><section class="grid">'+body+'</section>'+(run.floor!==null?'<div class="actions"><button data-reset="same">Replay seed</button><button data-reset="new">New draft</button></div>':'')}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(battleClick(b.dataset)){persist();render();return}if(b.dataset.enter&&run.floor!==null){run.battle=newRoom();enemyTurn();preview=null;persist();render();return}const n=run.picks.length;if(n<3&&dealDraft(run.seed)[n].includes(b.dataset.pick))run.picks.push(b.dataset.pick);else if(n===3&&run.floor===null&&['0','1','2'].includes(b.dataset.floor))run.floor=Number(b.dataset.floor);else if(run.floor!==null&&b.dataset.reset)run=fresh(b.dataset.reset==='same'?run.seed:randomSeed());else return;persist();render();document.getElementById('stage')?.focus()});
if(run.battle&&!run.battle.order){run.battle=newRoom();enemyTurn();persist()}else if(run.battle){kit(run.battle);if(run.battle.active>=3)enemyTurn();persist()}
render();
</script></html>
